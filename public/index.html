<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>専用ブラウザ（読み取り専用）</title>
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; font-family:"Hiragino Sans","Noto Sans JP",sans-serif; background:#f4f1ea; color:#222; }
  header { display:flex; gap:8px; align-items:center; padding:8px 12px; background:#2d3a2e; color:#fff; flex-wrap:wrap; }
  header .appTitle { font-weight:bold; font-size:16px; margin-right:4px; }
  header input[type=text] { flex:1; min-width:220px; padding:7px 10px; border-radius:6px; border:none; font-size:14px; }
  header button { padding:7px 14px; border:none; border-radius:6px; background:#74c69d; font-weight:bold; cursor:pointer; font-size:14px; }
  header .mini { background:#55685a; color:#fff; font-weight:normal; }
  #layout { display:flex; height:calc(100% - 49px); }
  .pane { overflow-y:auto; padding:8px; }
  #boardsPane { width:220px; border-right:1px solid #d8d2c4; background:#eceae2; flex-shrink:0; }
  #threadsPane { width:340px; border-right:1px solid #d8d2c4; background:#f8f6f0; flex-shrink:0; display:flex; flex-direction:column; }
  #postsPane { flex:1; background:#fffef9; }
  .pane input[type=text] { width:100%; padding:6px 9px; border:1px solid #c9c2ae; border-radius:6px; margin-bottom:8px; font-size:14px; }
  .catName { font-weight:bold; margin:10px 2px 4px; color:#2d6a4f; font-size:13px; }
  .boardItem { padding:5px 8px; border-radius:6px; cursor:pointer; font-size:14px; }
  .boardItem:hover { background:#dde8d8; }
  .boardItem.active { background:#b7d3ac; font-weight:bold; }
  .threadItem { padding:7px 8px; border-bottom:1px solid #e5e0d0; cursor:pointer; font-size:14px; line-height:1.45; }
  .threadItem:hover { background:#f0ecd9; }
  .threadItem.active { background:#fdf3c9; }
  .threadItem.read .tTitle { color:#999; }
  .threadItem .meta { color:#888; font-size:12px; }
  .threadItem .cnt { color:#c0392b; font-weight:bold; font-size:12px; }
  #threadsList { overflow-y:auto; flex:1; }
  .post { padding:8px 10px; border-bottom:1px solid #eee6d2; font-size:15px; }
  .post:target, .post.flash { background:#fff3b0; }
  .post .head { font-size:13px; color:#555; margin-bottom:3px; }
  .post .num { font-weight:bold; color:#2d6a4f; }
  .post .name { color:#117743; font-weight:bold; }
  .post .id { color:#888; cursor:pointer; text-decoration:underline dotted; }
  .post .body { white-space:pre-wrap; word-break:break-word; line-height:1.65; }
  .post .body a { color:#1a5fb4; }
  .post.sameId { outline:2px solid #f4a261; outline-offset:-2px; }
  .post.child { border-left:3px solid #b7d3ac; }
  .post.newpost { background:#fffbe8; }
  .newLine { background:#ffe9a8; color:#7a5b00; font-size:12px; font-weight:bold; padding:4px 10px; border-top:2px solid #e6c34a; border-bottom:2px solid #e6c34a; }
  #threadSort { padding:6px; border:1px solid #c9c2ae; border-radius:6px; font-size:13px; background:#fff; }
  .mini2 { padding:5px 12px; border:1px solid #c9c2ae; border-radius:6px; background:#fff; cursor:pointer; font-size:13px; }
  .mini2:hover { background:#f0ecd9; }
  #threadHead { padding:10px 12px; border-bottom:2px solid #d8d2c4; background:#fdfaf0; position:sticky; top:-8px; }
  #threadHead .t { font-size:17px; font-weight:bold; }
  .badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px; background:#40916c; color:#fff; margin-left:8px; vertical-align:middle; }
  .badge.kako { background:#8d6e63; }
  .status { color:#888; font-size:13px; padding:10px 4px; }
  .err { color:#c0392b; }
  @media (max-width: 900px) {
    #layout { flex-direction:column; height:auto; }
    #boardsPane, #threadsPane { width:100%; max-height:38vh; border-right:none; border-bottom:1px solid #d8d2c4; }
  }
</style>
</head>
<body>
<header>
  <span class="appTitle">📖 専用ブラウザ</span>
  <input type="text" id="urlInput" placeholder="スレURLを貼り付け（例：https://asahi.5ch.io/test/read.cgi/newsplus/1794…/）">
  <button id="openUrlBtn">開く</button>
  <button class="mini" id="fontDown">A-</button>
  <button class="mini" id="fontUp">A+</button>
  <label style="font-size:13px;"><input type="checkbox" id="optThumb"> 🖼 サムネ（DDG経由）</label>
  <label style="font-size:13px;"><input type="checkbox" id="optTree"> 🌲 ツリー表示</label>
</header>
<div id="layout">
  <div class="pane" id="boardsPane">
    <input type="text" id="boardFilter" placeholder="板を検索">
    <div id="boardsList"><div class="status">読み込み中…</div></div>
  </div>
  <div class="pane" id="threadsPane">
    <input type="text" id="threadFilter" placeholder="スレタイを検索">
    <div style="display:flex; gap:6px; margin-bottom:8px;">
      <select id="threadSort" title="スレの並び順" style="flex:1;">
        <option value="ikioi">勢い順</option>
        <option value="standard">標準順（板の並び）</option>
        <option value="count">レス数順</option>
        <option value="new">新しい順</option>
      </select>
      <button class="mini2" id="threadsRefresh" title="スレ一覧を更新">↻ 更新</button>
    </div>
    <div id="threadsList"><div class="status">← 板を選んでね</div></div>
  </div>
  <div class="pane" id="postsPane">
    <div class="status">スレを選ぶとここに表示されます。過去ログも自動で探します。</div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const boardsList = $('boardsList'), threadsList = $('threadsList'), postsPane = $('postsPane');
  let boardsData = [], curBoard = null, threadsData = [], curThread = null;
  let fontSize = parseInt(localStorage.getItem('bbsr_font') || '15', 10);
  const readSet = new Set(JSON.parse(localStorage.getItem('bbsr_read') || '[]'));
  let boardHist = JSON.parse(localStorage.getItem('bbsr_boardHist') || '[]');  // [{host,board}] 新しい順
  let lastReadMap = JSON.parse(localStorage.getItem('bbsr_lastRead') || '{}'); // 'h/b/k' -> 最後に見たレス番号
  function noteBoardVisit(b) {
    boardHist = boardHist.filter(x => !(x.host === b.host && x.board === b.board));
    boardHist.unshift({ host: b.host, board: b.board });
    boardHist = boardHist.slice(0, 20);
    localStorage.setItem('bbsr_boardHist', JSON.stringify(boardHist));
  }
  function boardNameOf(host, board) {
    for (const cat of boardsData) for (const b of cat.boards) if (b.host === host && b.board === board) return b.name;
    return board;
  }

  function esc(s) {
    return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  async function api(path) {
    const r = await fetch(path);
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'エラー');
    return j;
  }
  function applyFont() { postsPane.style.fontSize = fontSize + 'px'; document.querySelectorAll('.post').forEach(p => p.style.fontSize = fontSize + 'px'); }
  $('fontUp').onclick = () => { fontSize = Math.min(22, fontSize + 1); localStorage.setItem('bbsr_font', fontSize); applyFont(); };
  $('fontDown').onclick = () => { fontSize = Math.max(12, fontSize - 1); localStorage.setItem('bbsr_font', fontSize); applyFont(); };

  // ---------- 板一覧 ----------
  function renderBoards() {
    const q = $('boardFilter').value.trim();
    boardsList.innerHTML = '';
    if (!q && boardHist.length) {
      const c = document.createElement('div');
      c.className = 'catName'; c.textContent = '★ 最近開いた板';
      boardsList.appendChild(c);
      for (const h of boardHist) {
        const b = { host: h.host, board: h.board, name: boardNameOf(h.host, h.board) };
        const d = document.createElement('div');
        d.className = 'boardItem' + (curBoard && curBoard.host === b.host && curBoard.board === b.board ? ' active' : '');
        d.textContent = b.name;
        d.onclick = () => { curBoard = b; noteBoardVisit(b); renderBoards(); loadThreads(); };
        boardsList.appendChild(d);
      }
    }
    for (const cat of boardsData) {
      const items = cat.boards.filter(b => !q || b.name.includes(q));
      if (!items.length) continue;
      const c = document.createElement('div');
      c.className = 'catName'; c.textContent = cat.category;
      boardsList.appendChild(c);
      for (const b of items) {
        const d = document.createElement('div');
        d.className = 'boardItem' + (curBoard && curBoard.host === b.host && curBoard.board === b.board ? ' active' : '');
        d.textContent = b.name;
        d.onclick = () => { curBoard = b; noteBoardVisit(b); renderBoards(); loadThreads(); };
        boardsList.appendChild(d);
      }
    }
    if (!boardsList.children.length) boardsList.innerHTML = '<div class="status">見つかりません</div>';
  }
  $('boardFilter').addEventListener('input', renderBoards);

  // ---------- スレ一覧 ----------
  async function loadThreads() {
    threadsList.innerHTML = '<div class="status">読み込み中…</div>';
    try {
      threadsData = await api(`/api/subject?host=${encodeURIComponent(curBoard.host)}&board=${encodeURIComponent(curBoard.board)}`);
      renderThreads();
    } catch (e) {
      threadsList.innerHTML = '<div class="status err">読み込めませんでした：' + esc(e.message) + '</div>';
    }
  }
  function ikioiOf(t) {
    // 勢い = 1日あたりのレス数（スレ立て時刻＝キーのUNIX時刻から計算）
    const days = Math.max((Date.now() / 1000 - parseInt(t.key, 10)) / 86400, 1 / 24);
    return t.count / days;
  }
  function renderThreads() {
    const q = $('threadFilter').value.trim();
    threadsList.innerHTML = '';
    const items = threadsData.filter(t => !q || t.title.includes(q));
    const mode = $('threadSort').value;
    if (mode === 'ikioi') items.sort((a, b) => ikioiOf(b) - ikioiOf(a));
    else if (mode === 'count') items.sort((a, b) => b.count - a.count);
    else if (mode === 'new') items.sort((a, b) => parseInt(b.key, 10) - parseInt(a.key, 10));
    const frag = document.createDocumentFragment();
    for (const t of items) {
      const d = document.createElement('div');
      const key = curBoard.host + '/' + curBoard.board + '/' + t.key;
      d.className = 'threadItem' + (readSet.has(key) ? ' read' : '') + (curThread === key ? ' active' : '');
      const ik = ikioiOf(t);
      const ikTxt = ik >= 100 ? Math.round(ik).toString() : ik.toFixed(1);
      d.innerHTML = '<span class="tTitle">' + esc(t.title) + '</span> <span class="cnt">(' + t.count + ') 勢い:' + ikTxt + '</span>';
      d.onclick = () => openThread(curBoard.host, curBoard.board, t.key);
      frag.appendChild(d);
    }
    threadsList.appendChild(frag);
    if (!items.length) threadsList.innerHTML = '<div class="status">スレがありません</div>';
  }
  $('threadFilter').addEventListener('input', renderThreads);
  $('threadSort').value = localStorage.getItem('bbsr_sort') || 'ikioi';
  $('threadSort').addEventListener('change', () => { localStorage.setItem('bbsr_sort', $('threadSort').value); renderThreads(); });
  $('threadsRefresh').onclick = () => { if (curBoard) loadThreads(); };

  // ---------- スレ表示 ----------
  const optThumb = $('optThumb');
  optThumb.checked = localStorage.getItem('bbsr_thumb') !== '0';
  optThumb.addEventListener('change', () => { localStorage.setItem('bbsr_thumb', optThumb.checked ? '1' : '0'); if (curThread) { const [h, b, k] = curThread.split('/'); openThread(h, b, k); } });
  const optTree = $('optTree');
  optTree.checked = localStorage.getItem('bbsr_tree') !== '0';
  optTree.addEventListener('change', () => { localStorage.setItem('bbsr_tree', optTree.checked ? '1' : '0'); if (curThread) { const [h, b, k] = curThread.split('/'); openThread(h, b, k); } });
  function treeDepths(posts) {
    // 最初の >>アンカー（自分より前）を親とみなす簡易ツリー
    const depth = new Map();
    for (const p of posts) {
      let d = 0;
      const m = String(p.body || '').match(/[>＞]{2}(\d+)/);
      if (m) {
        const parent = parseInt(m[1], 10);
        if (parent >= 1 && parent < p.num && depth.has(parent)) d = depth.get(parent) + 1;
      }
      depth.set(p.num, Math.min(d, 8));
    }
    return depth;
  }

  function ddgImageProxy(u) {
    return 'https://external-content.duckduckgo.com/iu/?u=' + encodeURIComponent(u) + '&f=1&nofb=1';
  }
  function linkHref(u) { return u; }  // リンクは直接開く（rel=noreferrerで参照元は送らない）
  function renderBody(body) {
    let s = esc(body);
    // まず専ブラ内で開けるスレURL（前スレ等）をトークン化する。
    // https付き / ttps（h欠け）/ スキーム無しの裸URL、read.cgi形と kako・dat形に対応
    const threadTokens = [];
    const HOSTRE = '((?:[a-z0-9-]+\\.)+(?:5ch\\.net|5ch\\.io|bbspink\\.com)|bbs\\.eddibb\\.cc)';
    const stash = (host, board, key, disp) => {
      threadTokens.push({ host, board, key, disp });
      return '\u0001' + (threadTokens.length - 1) + '\u0002';
    };
    s = s.replace(new RegExp('(?:https?:\\/\\/|ttps:\\/\\/)?' + HOSTRE + '\\/(?:[A-Za-z0-9_]+\\/)?test\\/read\\.cgi\\/([A-Za-z0-9_]+)\\/(\\d{9,10})(?:\\/[\\x21-\\x7E]*)?', 'gi'),
      (m, host, board, key) => stash(host, board, key, m.replace(/[、。]+$/, '')));
    s = s.replace(new RegExp('(?:https?:\\/\\/|ttps:\\/\\/)?' + HOSTRE + '\\/([A-Za-z0-9_]+)\\/(?:kako\\/(?:\\d+\\/\\d+\\/)?|dat\\/)(\\d{9,10})\\.dat', 'gi'),
      (m, host, board, key) => stash(host, board, key, m));
    s = s.replace(/(?:https?:\/\/|ttps:\/\/)[^\s<]+/g, (u) => {
      const fixed = u.startsWith('ttps') ? 'h' + u : u;  // h欠けを補完
      const yt = fixed.replace(/&amp;/g, '&').match(/(?:youtube\.com\/(?:watch\?[^ \t]*v=|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
      if (yt && optThumb.checked) {
        const thumb = 'https://i.ytimg.com/vi/' + yt[1] + '/hqdefault.jpg';
        return '<a href="' + linkHref(fixed) + '" target="_blank" rel="noopener noreferrer">' + u + '</a>'
          + '<br><a href="' + linkHref(fixed) + '" target="_blank" rel="noopener noreferrer">'
          + '<img loading="lazy" src="' + ddgImageProxy(thumb) + '" alt="" '
          + 'style="max-width:240px; max-height:180px; border-radius:8px; margin:4px 0;" '
          + 'onerror="this.style.display=\'none\'"></a>';
      }
      const isImg = /\.(jpe?g|png|gif|webp|avif)([?#].*)?$/i.test(fixed.replace(/&amp;/g, '&'));
      if (isImg && optThumb.checked) {
        return '<a href="' + linkHref(fixed) + '" target="_blank" rel="noopener noreferrer">' + u + '</a>'
          + '<br><a href="' + linkHref(fixed) + '" target="_blank" rel="noopener noreferrer">'
          + '<img loading="lazy" src="' + ddgImageProxy(fixed.replace(/&amp;/g, '&')) + '" alt="" '
          + 'style="max-width:190px; max-height:190px; border-radius:8px; margin:4px 0;" '
          + 'onerror="this.style.display=\'none\'"></a>';
      }
      return '<a href="' + linkHref(fixed) + '" target="_blank" rel="noopener noreferrer">' + u + '</a>';
    });
    // トークンを「専ブラ内で開く」リンクに戻す
    s = s.replace(/\u0001(\d+)\u0002/g, (m, i) => {
      const t = threadTokens[+i];
      return '<a href="#" data-threadlink="' + t.host + '|' + t.board + '|' + t.key + '" title="専ブラ内で開く">'
        + esc(t.disp) + ' <span style="font-size:11px;">（内）</span></a>';
    });
    s = s.replace(/&gt;&gt;(\d+)/g, '<a href="#" data-anchor="$1">&gt;&gt;$1</a>');
    return s;
  }
  async function openThread(host, board, key, opts = {}) {
    curThread = host + '/' + board + '/' + key;
    readSet.add(curThread);
    localStorage.setItem('bbsr_read', JSON.stringify([...readSet].slice(-500)));
    renderThreads();
    postsPane.innerHTML = '<div class="status">読み込み中…（現行スレ → 過去ログの順に探します）</div>';
    try {
      const data = await api(`/api/thread?host=${encodeURIComponent(host)}&board=${encodeURIComponent(board)}&key=${encodeURIComponent(key)}`);
      const title = (data.posts[0] && data.posts[0].title) || '(タイトル不明)';
      const badge = data.source === 'kako' ? '<span class="badge kako">過去ログ</span>' : '<span class="badge">現行スレ</span>';
      const maxNum = data.posts.length ? data.posts[data.posts.length - 1].num : 0;
      const known = lastReadMap[curThread] || 0;   // 前回見たのはここまで
      const hasNew = known > 0 && known < maxNum;
      let html = '<div id="threadHead"><span class="t">' + esc(title) + '</span>' + badge
                 + ' <button class="mini2" id="threadRefresh">↻ 更新</button>'
                 + '<div class="status">' + data.posts.length + ' レス ／ ' + esc(host) + ' ／ ' + esc(board)
                 + (hasNew ? ' ／ 新着 ' + (maxNum - known) + ' 件' : '') + '</div></div>';
      // ID出現回数を数える
      const idCount = {};
      data.posts.forEach(p => { if (p.id) idCount[p.id] = (idCount[p.id] || 0) + 1; });
      const depths = optTree.checked ? treeDepths(data.posts) : new Map();
      for (const p of data.posts) {
        if (hasNew && p.num === known + 1) html += '<div class="newLine" id="newLine">―― ここから新しいレス ――</div>';
        const dep = Math.min(depths.get(p.num) || 0, 5);
        html += '<div class="post' + (dep > 0 ? ' child' : '') + (p.num > known && known > 0 ? ' newpost' : '') + '" id="post' + p.num + '" data-id="' + esc(p.id) + '"'
          + (dep > 0 ? ' style="margin-left:' + (dep * 16) + 'px"' : '') + '>'
          + '<div class="head"><span class="num">' + p.num + '</span> '
          + '<span class="name">' + esc(p.name) + '</span> '
          + esc(p.date)
          + (p.id ? ' <span class="id" data-hlid="' + esc(p.id) + '">ID:' + esc(p.id) + (idCount[p.id] > 1 ? ' (' + idCount[p.id] + ')' : '') + '</span>' : '')
          + '</div><div class="body">' + renderBody(p.body) + '</div></div>';
      }
      // 既読ラインを最新まで進める（次回はこの先が「新しいレス」になる）
      lastReadMap[curThread] = maxNum;
      const entries = Object.entries(lastReadMap);
      if (entries.length > 300) lastReadMap = Object.fromEntries(entries.slice(-300));
      localStorage.setItem('bbsr_lastRead', JSON.stringify(lastReadMap));
      postsPane.innerHTML = html;
      if (opts.toNewLine) {
        const nl = document.getElementById('newLine');
        if (nl) { nl.scrollIntoView({ block: 'start' }); postsPane.scrollTop -= 70; }
        else postsPane.scrollTop = postsPane.scrollHeight;
      } else {
        postsPane.scrollTop = 0;
      }
      applyFont();
      const trb = $('threadRefresh');
      if (trb) trb.onclick = () => openThread(host, board, key, { toNewLine: true });
      postsPane.querySelectorAll('[data-anchor]').forEach(a => {
        a.addEventListener('click', (ev) => {
          ev.preventDefault();
          const target = document.getElementById('post' + a.dataset.anchor);
          if (target) {
            target.scrollIntoView({ block: 'center' });
            target.classList.add('flash');
            setTimeout(() => target.classList.remove('flash'), 1200);
          }
        });
      });
      postsPane.querySelectorAll('[data-threadlink]').forEach(a => {
        a.addEventListener('click', (ev) => {
          ev.preventDefault();
          const [h, b, k] = a.dataset.threadlink.split('|');
          curBoard = { host: h, board: b, name: b };
          noteBoardVisit(curBoard);
          renderBoards();
          openThread(h, b, k);
        });
      });
      postsPane.querySelectorAll('[data-hlid]').forEach(el => {
        el.addEventListener('click', () => {
          const id = el.dataset.hlid;
          postsPane.querySelectorAll('.post').forEach(p => p.classList.toggle('sameId', p.dataset.id === id));
        });
      });
    } catch (e) {
      postsPane.innerHTML = '<div class="status err">開けませんでした：' + esc(e.message) + '<br>現行スレにも過去ログにも見つかりませんでした。</div>';
    }
  }

  // ---------- URL貼り付け ----------
  function openFromUrl() {
    let v = $('urlInput').value.trim();
    if (v && !/^https?:\/\//i.test(v)) v = 'https://' + v;  // スキーム無しの貼り付けも許容
    let host = '';
    try { host = new URL(v).hostname; } catch (e) {}
    const m = v.match(/\/test\/read\.cgi\/([A-Za-z0-9_]+)\/(\d{6,})/) ||          // read.cgi（板名1回・2回どちらの形でも）
              v.match(/\/([A-Za-z0-9_]+)\/kako\/(?:\d+\/\d+\/)?(\d{6,})\.dat/) || // 過去ログ .dat 直URL
              v.match(/\/([A-Za-z0-9_]+)\/dat\/(\d{6,})\.dat/);                    // 現行 .dat 直URL
    if (!m || !host) { alert('対応するURLの形式じゃないみたいです（read.cgi のスレURLか、kako の .dat URLを貼ってください）'); return; }
    curBoard = { host: host, board: m[1], name: m[1] };
    noteBoardVisit(curBoard);
    renderBoards();
    openThread(host, m[1], m[2]);
  }
  $('openUrlBtn').onclick = openFromUrl;
  $('urlInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') openFromUrl(); });

  // ---------- 起動 ----------
  (async () => {
    try {
      boardsData = await api('/api/boards');
      renderBoards();
    } catch (e) {
      boardsList.innerHTML = '<div class="status err">板一覧が取れませんでした：' + esc(e.message) + '</div>';
    }
  })();
})();
</script>
</body>
</html>
